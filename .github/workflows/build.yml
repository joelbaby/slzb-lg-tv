name: Build and test
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Test Berry backend and compile examples
        run: scripts/test-berry.sh
      - name: Build pairing client
        run: scripts/build-tls.sh
      - name: Test pairing protocol
        run: |
          node --check app/ui.js
          node tests/pairing.mjs
          node tests/ui.mjs
      - name: Build and test installer
        run: |
          python3 scripts/package.py
          python3 tests/package_test.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lg-tv-slzb-os
          path: dist/lg_tv.zip
          if-no-files-found: error
